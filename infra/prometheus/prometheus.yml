# Prometheus раз в 10 секунд опрашивает /actuator/prometheus каждого сервиса
# (Micrometer отдаёт метрики JVM, HTTP, Kafka, пулов соединений).
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: jazzlms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
        labels: { service: api-gateway }
      - targets: ['user-service:8081']
        labels: { service: user-service }
      - targets: ['course-service:8082']
        labels: { service: course-service }
      - targets: ['notification-service:8083']
        labels: { service: notification-service }
      - targets: ['analytics-service:8084']
        labels: { service: analytics-service }
      - targets: ['gamification-service:8085']
        labels: { service: gamification-service }
