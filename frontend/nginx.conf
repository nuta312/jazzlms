server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 — встроенный DNS docker. Без resolver nginx запомнил бы IP gateway
    # один раз при старте и сломался бы после пересоздания контейнера.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://api-gateway:8080;

    # SPA: любой путь отдаёт index.html, дальше роутинг делает React Router
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        client_max_body_size 320m;        # загрузка видео-уроков
        proxy_request_buffering off;      # не складывать файл на диск nginx, сразу стримить дальше
        proxy_read_timeout 600s;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
