# ============================================================
#  JazzLMS — учебная микросервисная платформа
#
#  Инфраструктура (без профиля):   docker compose up -d
#  Инфра + все сервисы + фронт:    docker compose --profile app up -d --build
#
#  Порты на хосте:
#    3000  frontend (nginx)         8080  api-gateway
#    8081  user-service (REST)      9091  user-service (gRPC)
#    8082  course-service           8083  notification-service
#    8084  analytics-service        8085  gamification-service
#    5432  PostgreSQL               27019 MongoDB  (в контейнере 27017)
#    6379  Redis                    19092 Kafka    (в контейнере 9092)
#    8090  Kafka UI                 9411  Zipkin
#    9002  MinIO S3 API             9003  MinIO console
#    3001  Grafana (логи, метрики)  9090  Prometheus     3100 Loki
# ============================================================
name: jazzlms

services:

  # ---------------- инфраструктура ----------------

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27019:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft-режим: Kafka без ZooKeeper
    image: apache/kafka:3.8.0
    ports: ["19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      # внутри docker-сети сервисы ходят на kafka:29092, с хоста (IDE) — на localhost:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: JazzLMS-Kafka-Cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  minio:
    # S3-совместимое объектное хранилище: сюда course-service кладёт видео и презентации.
    # Раньше здесь был MinIO, но его образы убрали и с Docker Hub, и с quay.io (401 при pull).
    # RustFS — совместимая замена с тем же S3 API и консолью; код course-service (MinIO Java SDK) не менялся.
    # Имя сервиса оставлено "minio", чтобы не трогать адреса в application.yml. Консоль: http://localhost:9003
    image: rustfs/rustfs:1.0.1
    ports: ["9002:9000", "9003:9001"]
    environment:
      RUSTFS_ACCESS_KEY: jazzlms
      RUSTFS_SECRET_KEY: jazzlms-secret-key
    volumes:
      - rustfs-data:/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: jazzlms
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:3
    ports: ["9411:9411"]

  # ---------------- логи и метрики (Grafana stack) ----------------

  loki:
    # хранилище логов
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki.yml
    ports: ["3100:3100"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    # собирает stdout всех контейнеров проекта и шлёт в Loki
    image: grafana/promtail:3.4.2
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    # метрики из /actuator/prometheus каждого сервиса
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

  grafana:
    # UI: логи (Loki), метрики (Prometheus), трейсы (Zipkin) в одном месте
    image: grafana/grafana:11.6.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # для занятий: смотреть можно без логина
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
      - zipkin

  # ---------------- микросервисы ----------------

  user-service:
    profiles: [app]
    build: ./services/user-service
    ports: ["8081:8081", "9091:9091"]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      ZIPKIN_HOST: zipkin
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  course-service:
    profiles: [app]
    build: ./services/course-service
    ports: ["8082:8082"]
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP: kafka:29092
      USER_SERVICE_GRPC_HOST: user-service
      ZIPKIN_HOST: zipkin
      MINIO_ENDPOINT: http://minio:9000          # внутри docker-сети
      MINIO_PUBLIC_URL: http://localhost:9002    # этот адрес попадёт в ссылку для браузера
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      user-service: { condition: service_started }
      minio: { condition: service_started }

  notification-service:
    profiles: [app]
    build: ./services/notification-service
    ports: ["8083:8083"]
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017          # внутри docker-сети — стандартный порт
      KAFKA_BOOTSTRAP: kafka:29092
      ZIPKIN_HOST: zipkin
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  analytics-service:
    profiles: [app]
    build: ./services/analytics-service
    ports: ["8084:8084"]
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      ZIPKIN_HOST: zipkin
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gamification-service:
    profiles: [app]
    build: ./services/gamification-service
    ports: ["8085:8085"]
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      USER_SERVICE_GRPC_HOST: user-service
      ZIPKIN_HOST: zipkin
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api-gateway:
    profiles: [app]
    build: ./services/api-gateway
    ports: ["8080:8080"]
    environment:
      REDIS_HOST: redis
      USER_SERVICE_HOST: user-service
      COURSE_SERVICE_HOST: course-service
      NOTIFICATION_SERVICE_HOST: notification-service
      ANALYTICS_SERVICE_HOST: analytics-service
      GAMIFICATION_SERVICE_HOST: gamification-service
      ZIPKIN_HOST: zipkin
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    profiles: [app]
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - api-gateway

volumes:
  pg-data:
  rustfs-data:
  mongo-data:
  loki-data:
  prom-data:
  grafana-data:
